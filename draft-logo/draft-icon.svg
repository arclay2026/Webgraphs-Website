<!-- Compass as the A -->
<g>
  <rect x="274" y="-16" width="10" height="16" rx="3" fill="currentColor"/>
  <!-- legs -->
  <path d="M279 10 L238 98" stroke="currentColor" stroke-width="14" fill="none"/>
  <path d="M279 10 L319 96" stroke="currentColor" stroke-width="14" fill="none"/>
  <!-- needle -->
